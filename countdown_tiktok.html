<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Décompte GTA 6 — TikTok</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800;900&display=swap');
:root{--acc:#a855f7;--acc2:#c4b5fd;--glow:168,85,247;--W:1080px;--H:1920px}
*{margin:0;padding:0;box-sizing:border-box}

.big{font-family:Anton,'Inter Display',Impact,sans-serif;font-weight:900}
body.p30{--acc:#ff3d81;--acc2:#ffd1e3;--glow:255,61,129}
/* ===== widget ===== */
#card{position:absolute;top:300px;left:50%;margin-left:-450px;width:900px;display:flex;align-items:center;gap:22px;padding:20px 30px 20px 22px;border-radius:26px;
 background:linear-gradient(135deg,rgba(30,10,60,.88),rgba(10,4,24,.88));border:1.5px solid rgba(var(--glow),.55);
 box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px rgba(var(--glow),.25);overflow:hidden;transition:opacity .6s,transform .6s;animation:cin .9s cubic-bezier(.2,.9,.2,1) both}

#card .lg i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(var(--glow),1) 80%,transparent 85%);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#card .tx{display:flex;flex-direction:column;gap:4px}

body.big1 #card{opacity:0;transform:scale(.8)}
/* ===== dernière minute ===== */

body.big1 #bigv{opacity:1}#bigv .dim,#bigv .wrap{display:none!important}
#bigv .dim{position:absolute;inset:0;background:radial-gradient(circle,rgba(12,4,28,.55),rgba(7,3,15,.9))}

.lab.flash{animation:kf .6s ease-out}
@keyframes kf{from{transform:scale(1.3);color:#fff}}
.dial{position:relative;width:600px;height:600px;display:flex;align-items:center;justify-content:center}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:14}

#num{font-size:700px;line-height:1;text-shadow:0 0 60px rgba(var(--glow),.95);will-change:transform,opacity}

@keyframes numz{0%{transform:scale(2.4);opacity:0}22%{opacity:1;transform:scale(1.05)}80%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}
.shock{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:6px solid rgba(var(--glow),.9);opacity:0}
.shock.go{animation:shock 1s ease-out}

/* ===== lancement ===== */

 background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 4deg,transparent 4deg 14deg);animation:rays 6s linear forwards,rin .8s ease-out .2s forwards}

@keyframes sun{to{transform:scale(1)}}

#go .gta .vi{animation-delay:.85s!important;font-size:1.25em;background:linear-gradient(180deg,#ffd6a5 0%,#ff6ec7 45%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,110,199,.8))}
#go .gta span{text-shadow:0 0 40px rgba(168,85,247,.9),0 10px 0 rgba(0,0,0,.35)}#go .gta .vi{text-shadow:none}

@keyframes slam{0%{opacity:0;transform:scale(4) translateY(-20px)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}

#lgw .sw{position:absolute;top:-10%;bottom:-10%;width:22%;left:-30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);mix-blend-mode:screen;opacity:0}
#lgw .sw{display:none}
@keyframes lsw{0%{left:-30%;opacity:1}100%{left:130%;opacity:1}}
body.cdone #lgw img{animation:bloom 2.2s ease-out}
@keyframes bloom{0%{filter:drop-shadow(0 0 40px rgba(255,140,170,.35)) brightness(1)}20%{filter:drop-shadow(0 0 90px rgba(255,200,220,.9)) brightness(1.6)}100%{filter:drop-shadow(0 0 40px rgba(255,140,170,.35)) brightness(1)}}

#cnum span{position:absolute;left:0;right:0;top:0;font-weight:200;font-size:140px;line-height:1;letter-spacing:.08em;color:#fff;font-variant-numeric:tabular-nums;animation:cn 1s ease forwards}
@keyframes cn{0%{opacity:0;transform:translateY(10px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#cine .av{position:absolute;left:0;right:0;top:calc(50% + 200px);font-weight:700;font-size:30px;letter-spacing:.55em;padding-left:.55em;color:#fff;text-align:center;opacity:0}
body.cdone #cine .ck,body.cdone #cnum{opacity:0}
body.cdone #cine .av{animation:av 1.4s ease forwards .4s}
@keyframes av{from{opacity:0;letter-spacing:1.2em}to{opacity:1;letter-spacing:.55em}}
#cine .fl{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,220,235,.9),rgba(255,140,170,.25) 45%,transparent 70%);opacity:0}
body.cdone #cine .fl{animation:cfl 1.6s ease-out}
@keyframes cfl{0%{opacity:0}12%{opacity:1}100%{opacity:0}}

/* ===== minuit : impact ===== */
#cine .rays2{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;opacity:0;
 background:repeating-conic-gradient(from 0deg,rgba(255,170,120,.16) 0 3deg,transparent 3deg 11deg,rgba(236,72,153,.12) 11deg 13deg,transparent 13deg 22deg);
 -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 25%,transparent 55%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 25%,transparent 55%)}

#cine .streak{position:absolute;left:-10%;right:-10%;top:50%;height:4px;margin-top:-2px;background:linear-gradient(90deg,transparent,rgba(255,190,150,.0) 10%,rgba(255,220,200,.95) 50%,rgba(255,190,150,0) 90%,transparent);opacity:0;transform:scaleX(.1);filter:blur(1px)}

@keyframes stk{0%{opacity:0;transform:scaleX(.05)}12%{opacity:1;transform:scaleX(1.2)}100%{opacity:0;transform:scaleX(1.6)}}
#cine .wave{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px;border-radius:50%;border:3px solid rgba(255,200,180,.8);opacity:0}
body.cdone #cine .wave{animation:wv 1.4s ease-out forwards}body.cdone #cine .wave.w2{animation-delay:.18s;border-color:rgba(236,72,153,.7)}
@keyframes wv{0%{transform:scale(.3);opacity:1}100%{transform:scale(9);opacity:0}}
#cine canvas{position:absolute;inset:0}

#cine .av{font-weight:900!important;font-size:40px!important;letter-spacing:.32em!important;padding-left:.32em!important;
 background:linear-gradient(90deg,#ffd6a5,#ff8fb1 40%,#c084fc 75%,#ffd6a5);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 0 22px rgba(255,140,170,.55))}

/* ===== dernière minute v3 ===== */
#bigv{transition:opacity 1.2s ease,transform 1.2s ease}

.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lab2{font-weight:600;font-size:22px;letter-spacing:.6em;padding-left:.6em;color:rgba(255,255,255,.75);text-transform:uppercase}
#sec2{position:relative;width:100%;height:234px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
